# ============================================================================
# PROD profile — values are supplied via environment variables at deploy time.
# Nothing environment-specific is hard-coded here.
# ============================================================================
openfga:
  api-url: ${OPENFGA_API_URL}
  store-id: ${OPENFGA_STORE_ID}
  authorization-model-id: ${OPENFGA_MODEL_ID:}

# Keep health details private in production; reduce log verbosity.
management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.jacob.openfga: INFO
